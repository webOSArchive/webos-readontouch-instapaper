<!doctype html>
 <html>
 <head>
     <meta name="apple-mobile-web-app-capable" content="yes">
     <meta name="viewport" content="width=device-width initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
     <title>ReadOnTouch PRO</title>
     <script src="enyo/framework/enyo.js" type="text/javascript"></script>
 </head>
 <body onLoad="onBodyLoad()">
     <script type="text/javascript">
       
		if (Util.isPlaybook()) {
			localStorage.setItem("debugOutput", true);
		}

		window.onorientationchange = function() 
		{
			// console.log("jawoll");
		    onRotate( );
		}

       	var theApp = null;
       
        function onBodyLoad(){
            document.addEventListener("deviceready", onDeviceReady, false);
            //--> For chrome testing
            onDeviceReady();
        }

        function onDeviceReady(){
            console.log("starting the app");
            // console.log("device.platform.toLowerCase(): " + device.platform);
            // Util.init();
            
            // console.log("Util.getDaysUntilDate(): " + Util.getDaysUntilDate());
            // if (Util.getDaysUntilDate() == 0) {
            if (1 == 2) {
                window.location = "./invalid.html";
            } else {
                
                // localStorage.clear();
                if (Util.isWebOS() == false) {
	                this.theApp = new ReadOnTouch();
	                // if (window.PalmSystem && enyo.windowParams){
	                    // theApp.setLaunchParams(enyo.windowParams);
	                // }
	                
	                if (Util.isBlackBerry()) {
		                blackberry.app.event.onSwipeDown(showMenu);
		                window.addEventListener("online", online_function, false);
            			window.addEventListener("offline", offline_function, false);
	                }
	             
	                this.theApp.renderInto(document.body);
	                if (Util.getSettings().accountVerified == true && Util.getSettings().username != "" && Util.getSettings().password != "") {
	                    this.theApp.normalStart();
	                } else {
	                    this.theApp.showWelcomePage();
	                }
				}                 
                else {
		            var launcher = enyo.application.launcher = new Launcher();
			        launcher.startup();
                }
                
            }
        }
        
        function showMenu(){
            if (this.theApp != null) {
            	this.theApp.showMenuDialog();
            }
		}
		
		function online_function() {
            if (this.theApp != null) {
	            var inResponse = { "isInternetConnectionAvailable": true };
	            his.theApp.connectionResponseHandler( "null", inResponse );
            }
		}

		function offline_function() {
            if (this.theApp != null) {
	            var inResponse = { "isInternetConnectionAvailable": false };
	            his.theApp.connectionResponseHandler( "null", inResponse );
            }
		}

        function onRotate( ){
        	console.log("onRotate detected!");
            if (this.theApp != null) {
            	this.theApp.onWindowRotated( );
            }
		}

     </script>
 </body>
 </html>
